# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "{{ crate_name }}"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["{{ authors }}"]

[dependencies]
concordium-std = { version = "10.1" }

[dev-dependencies]
concordium-smart-contract-testing = "4.3"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
codegen-units = 1
