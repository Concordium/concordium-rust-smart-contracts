[package]
name = "{{crate_name}}"
version = "0.1.0"
authors = [ "{{authors}}" ]
edition = "2024"
license = "MPL-2.0"
description = "{{description}}"

[dependencies]
concordium-std = {version = "11.0.0"}
concordium-cis2 = {version = "7.0.0"}

[dev-dependencies]
concordium-smart-contract-testing = "5.0.0"
concordium-std-derive = "6.1.0"

[lib]
crate-type=["cdylib", "rlib"]

[profile.release]
codegen-units = 1
opt-level = "s"
