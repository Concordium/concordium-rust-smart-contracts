[package]
name = "{{crate_name}}"
version = "0.1.0"
authors = [ "{{authors}}" ]
edition = "2024"
license = "MPL-2.0"
description = "{{description}}"

[dependencies]
concordium-std = {version = "10.1"}
concordium-cis2 = {version = "6.2"}

[dev-dependencies]
concordium-smart-contract-testing = "4.3"
concordium-std-derive = "6.0"

[lib]
crate-type=["cdylib", "rlib"]

[profile.release]
codegen-units = 1
opt-level = "s"
