# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "{{crate_name}}"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = [ "{{authors}}" ]
description = "{{description}}"

[dependencies]
concordium-std = {version = "10.1"}
concordium-cis2 = {version = "6.2"}

[dev-dependencies]
concordium-smart-contract-testing = "4.4"
concordium-std-derive = "6.0"

[lib]
crate-type=["cdylib", "rlib"]

[profile.release]
opt-level = "s"
codegen-units = 1
